services:
  # MIGRATED 2026-05-07 -> central-db (/opt/docker/central-db).
  # Service kept commented for rollback. Volume pgdata preserved.
  # Rollback: uncomment, change backend DATABASE_URL host from central-db to postgres, remove `databases` from networks, re-add depends_on.
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   container_name: group-documents-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: brainhub
  #     POSTGRES_USER: brainhub
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #     - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U brainhub -d brainhub"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - internal

  redis:
    image: redis:7-alpine
    container_name: group-documents-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  backend:
    image: ghcr.io/devpedrogomes/group-documents/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: group-documents-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=https://group-documents.pgdev.com.br
      - DATABASE_URL=postgresql+asyncpg://brainhub:${DB_PASSWORD}@central-db:5432/brainhub
      - JWT_SECRET=${JWT_SECRET}
      - UPLOADS_PATH=/app/uploads
      - REDIS_URL=redis://redis:6379
      # Envs do nucleo compartilhado. SEPARADAS do REDIS_URL do app de proposito:
      # os dois podem apontar para instancias diferentes. O metering FALHA
      # FECHADO — sem esta variavel o pacote tenta `redis://localhost:6379`,
      # nao acha ninguem dentro do container, e RECUSA toda chamada com 503.
      # Foi exatamente isso que derrubou a demo depois do deploy da Parte A.
      - AGENT_OPS_REDIS_URL=redis://redis:6379
      - AGENT_OPS_PROJETO=brainhub
      # Teto de profundidade da fila; acima dele a API recusa com 429 em vez de
      # aceitar trabalho que nao vai conseguir fazer. O default do pacote e 500,
      # e 500 aqui nao freia nada: com `max_jobs = 4` e jobs que podem ir ate os
      # 30 min do `job_timeout`, 500 na fila sao dias de espera enquanto a API
      # segue respondendo 200 e prometendo o trabalho. 50 e o ponto em que a
      # promessa ainda e honesta — os ultimos da fila esperam cerca de uma hora
      # no ritmo tipico (alguns minutos por documento) — e fica abaixo do
      # `daily_ingest_limit` (100), entao o freio da fila chega a agir antes de
      # a cota do dia acabar, em vez de ser inalcancavel.
      - AGENT_OPS_PROFUNDIDADE_MAXIMA=50
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - proxy
      - databases
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.group-documents-api.entrypoints=https"
      - "traefik.http.routers.group-documents-api.rule=Host(`group-documents-api.pgdev.com.br`)"
      - "traefik.http.routers.group-documents-api.tls=true"
      - "traefik.http.routers.group-documents-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.group-documents-api.middlewares=group-documents-api-security@docker,global-ratelimit@file,strip-server-header@file"
      - "traefik.http.services.group-documents-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.group-documents-api-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.group-documents-api-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.group-documents-api-security.headers.stsPreload=true"
      - "traefik.http.middlewares.group-documents-api-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.group-documents-api-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.group-documents-api-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.group-documents-api-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.group-documents-api-security.headers.frameDeny=true"

  worker:
    image: ghcr.io/devpedrogomes/group-documents/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: group-documents-worker
    restart: unless-stopped
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://brainhub:${DB_PASSWORD}@central-db:5432/brainhub
      # `Settings.jwt_secret` e obrigatorio e sem default, e `app/db/engine.py`
      # instancia as settings no import — que `app/jobs/worker.py` faz. Sem esta
      # variavel o worker morre no import, ANTES de o arq subir: o container
      # entra em CrashLoop e a fila nunca e consumida.
      - JWT_SECRET=${JWT_SECRET}
      - UPLOADS_PATH=/app/uploads
      - REDIS_URL=redis://redis:6379
      # Mesmo motivo do backend: metering falha fechado sem isto.
      - AGENT_OPS_REDIS_URL=redis://redis:6379
      - AGENT_OPS_PROJETO=brainhub
      # Identico ao backend de proposito. O worker nao enfileira, entao o valor
      # nao muda o comportamento dele hoje; manter as duas pontas da mesma fila
      # com a mesma configuracao e o que evita a classe de bug em que cada lado
      # opera com um numero diferente sem ninguem notar.
      - AGENT_OPS_PROFUNDIDADE_MAXIMA=50
    volumes:
      # O worker LE os arquivos que a API gravou. Sem este mount, toda ingestao
      # falha com "arquivo nao encontrado" — e falha no worker, longe de quem
      # subiu o arquivo.
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # O proprio health check do arq: le no Redis a chave que o worker renova a
      # cada `health_check_interval` e sai != 0 se ela estiver velha ou ausente.
      # O que estava aqui antes NUNCA reprovava: `CMD-SHELL` roda
      # `/bin/sh -c "pgrep -f 'arq app.jobs.worker' ..."`, e a linha de comando
      # desse proprio shell contem o padrao, entao o `pgrep -f` casava com ele
      # mesmo — worker morto ou travado seguia "healthy". (E `pgrep` nem existe
      # na imagem: vem do `procps`, que o Dockerfile nao instala.)
      test: ["CMD", "arq", "app.jobs.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - internal
      - databases

  frontend:
    image: ghcr.io/devpedrogomes/group-documents/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://group-documents-api.pgdev.com.br
    container_name: group-documents-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://group-documents-api.pgdev.com.br
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.group-documents.entrypoints=https"
      - "traefik.http.routers.group-documents.rule=Host(`group-documents.pgdev.com.br`)"
      - "traefik.http.routers.group-documents.tls=true"
      - "traefik.http.routers.group-documents.tls.certresolver=letsencrypt"
      - "traefik.http.routers.group-documents.middlewares=group-documents-security@docker,global-ratelimit@file,strip-server-header@file"
      - "traefik.http.services.group-documents.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.group-documents-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.group-documents-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.group-documents-security.headers.stsPreload=true"
      - "traefik.http.middlewares.group-documents-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.group-documents-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.group-documents-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.group-documents-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.group-documents-security.headers.frameDeny=true"
      - "traefik.http.middlewares.group-documents-security.headers.contentSecurityPolicy=default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

volumes:
  pgdata:
  uploads:

networks:
  internal:
  proxy:
    external: true
  databases:
    external: true
