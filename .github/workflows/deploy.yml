name: Build & push image (VPS auto-pulls)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Roda ANTES do build e trava o deploy. A suite prende regressoes que ja
  # estiveram em producao (limiar de relevancia contra a escala errada, snippet
  # truncado antes do gerador, uma requisicao de embedding por variante de
  # query). Nao toca a rede: sem chave de API, sem custo, alguns segundos.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -q -r requirements-dev.txt
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://x/y
          JWT_SECRET: ci
          VOYAGE_API_KEY: ci
        run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Placeholders p/ env_file referenciados (compose parsing; .env real vive na VPS)
        run: |
          python3 - <<'EOF'
          import yaml, pathlib
          d = yaml.safe_load(open("docker-compose.yml")) or {}
          for s in (d.get("services") or {}).values():
              ef = (s or {}).get("env_file")
              if not ef:
                  continue
              for it in (ef if isinstance(ef, list) else [ef]):
                  p = it.get("path") if isinstance(it, dict) else it
                  fp = pathlib.Path(p)
                  fp.parent.mkdir(parents=True, exist_ok=True)
                  fp.touch()
          pathlib.Path(".env").touch()
          EOF
      # `push` sem argumento empurra TODO servico que tem `build:` — e ignora os
      # que nao tem (o `redis`, que vem do Docker Hub). A lista na mao omitia o
      # `worker`; hoje ele escapa por acidente, porque declara a MESMA tag do
      # `backend` e o push do backend publica a imagem dos dois. No dia em que o
      # worker ganhar imagem propria (outro Dockerfile, outro contexto), a lista
      # o deixaria de fora em silencio e a VPS puxaria uma `:latest` velha.
      # Sem lista, nao ha o que esquecer de atualizar.
      - name: Build + push (todo servico com `build:`)
        run: |
          docker compose build
          docker compose push
